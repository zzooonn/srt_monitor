[telegram]
; 텔레그램 봇 토큰 (@BotFather 에서 발급)
bot_token = 여기에_텔레그램_봇_토큰_입력
; 텔레그램 채팅 ID (@userinfobot 에서 확인)
chat_id = 여기에_채팅_ID_입력

[srt]
; SRT 로그인 아이디 (멤버십 번호 또는 이메일)
id = SRT_아이디_입력
; SRT 비밀번호
password = SRT_비밀번호_입력

[train]
; 출발일 (YYYYMMDD 형식)
departure_date = auto
; 조회 시작 시각 (HHMMSS 형식)
departure_time = 200000
; 이 시각 이후 열차는 무시 (HHMMSS 형식)
max_departure_time = 230000
; 출발역 이름
departure_station = 오송
; 도착역 이름
arrival_station = 동탄

[passengers]
; 어른/청소년
adult_count = 2
; 어린이
child_count = 0
; 경로
senior_count = 0
; 장애 1~3급
disability_1_to_3_count = 0
; 장애 4~6급
disability_4_to_6_count = 0

[seats]
; 특실 확인 여부 (true / false)
check_special = true
; 일반실 확인 여부 (true / false)
check_normal = true
; 모든 좌석이 같은 호차 안에 있어야 하는지
require_same_car = false
; 모든 좌석이 같은 호차/같은 줄이어야 하는지 (엄격 모드)
require_same_row = false
; AB 또는 CD처럼 실제로 붙은 좌석 조합을 포함해야 함
require_adjacent_seats = true
; SRT 예약 요청 시 창가 우선
prefer_window_seat = true
; 배정 결과에 창가 좌석이 반드시 포함되어야 하는지
require_window_seat = false

[options]
; SRT 조회 간격 (초) — 너무 짧으면 IP 차단될 수 있음
poll_interval = 30
; true: 취소표 발견 시 자동 예약 / false: 알림만
auto_reserve = true
; 자동 예약 최대 건수 (달성 시 봇 종료)
max_reservations = 1
; 좌석 조건 불일치 시 자동 취소
auto_cancel_if_seat_mismatch = true
; 떨어진 좌석/조건 불일치 좌석이 배정되면 텔레그램 알림
notify_if_seat_mismatch = true
; 하트비트 간격 (초) — 이 간격마다 텔레그램으로 생존 알림 전송
heartbeat_interval = 1800
